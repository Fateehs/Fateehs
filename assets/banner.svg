<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Fatih Enes Selvi — E-commerce Technology Lead</title>
  <desc id="desc">Shopify themes, apps and integrations. A small diagram shows Shopify and checkout data flowing through a central sync hub to marketplace, shipping and ERP systems.</desc>
  <defs>
    <radialGradient id="glowViolet" cx="88%" cy="-10%" r="75%">
      <stop offset="0" stop-color="#3024b8" stop-opacity=".6"/>
      <stop offset="1" stop-color="#3024b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="78%" cy="110%" r="55%">
      <stop offset="0" stop-color="#2eff65" stop-opacity=".12"/>
      <stop offset="1" stop-color="#2eff65" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#070b19"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#glowViolet)"/>
    <rect width="1200" height="340" fill="url(#glowGreen)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".12"/>

  <!-- Left: identity -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <circle cx="79" cy="98" r="5" fill="#2eff65"/>
    <circle cx="79" cy="98" r="5" fill="none" stroke="#2eff65" stroke-width="2">
      <animate attributeName="r" values="5;13" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".7;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="96" y="104" font-size="17" font-weight="600" letter-spacing="3" fill="#2eff65">E-COMMERCE TECHNOLOGY LEAD</text>
    <text x="72" y="180" font-size="64" font-weight="700" letter-spacing="-1" fill="#f7f5f0">Fatih Enes Selvi</text>
    <text x="74" y="230" font-size="26" fill="#c1c1cc">Shopify themes, apps &amp; integrations</text>
    <text x="74" y="282" font-size="17" fill="#a9a9b8" font-family="'Cascadia Code', SFMono-Regular, Consolas, Menlo, monospace">fatihselvi.com</text>
  </g>

  <!-- Right: integration flow -->
  <g fill="none" stroke="#33407a" stroke-width="1.5">
    <path id="l1" d="M844,120 C880,120 878,170 908,170"/>
    <path id="l2" d="M848,220 C880,220 878,170 908,170"/>
    <path id="r1" d="M972,170 C1000,170 998,80 1027,80"/>
    <path id="r2" d="M972,170 L1039,170"/>
    <path id="r3" d="M972,170 C1000,170 998,260 1033,260"/>
  </g>

  <g fill="#2eff65">
    <circle r="3.5" opacity="0">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="0s"><mpath href="#l1" xlink:href="#l1"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.2s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.1s"><mpath href="#l2" xlink:href="#l2"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.2s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin=".5s"><mpath href="#r1" xlink:href="#r1"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.2s" repeatCount="indefinite" begin=".5s"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.3s"><mpath href="#r2" xlink:href="#r2"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.2s" repeatCount="indefinite" begin="1.3s"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.8s"><mpath href="#r3" xlink:href="#r3"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.2s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
  </g>

  <!-- Hub -->
  <circle cx="940" cy="170" r="32" fill="none" stroke="#2eff65" stroke-width="1.5">
    <animate attributeName="r" values="32;54" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".55;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="940" cy="170" r="32" fill="#0d152c" stroke="#2eff65" stroke-width="1.5"/>
  <path d="M927,170 l9,9 l17,-18" fill="none" stroke="#2eff65" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodes -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="middle">
    <g>
      <rect x="736" y="101" width="108" height="38" rx="19" fill="#111b35" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="790" y="125.5" fill="#e0dfec">Shopify</text>
    </g>
    <g>
      <rect x="732" y="201" width="116" height="38" rx="19" fill="#111b35" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="790" y="225.5" fill="#e0dfec">Checkout</text>
    </g>
    <g>
      <rect x="1027" y="61" width="136" height="38" rx="19" fill="#111b35" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="1095" y="85.5" fill="#e0dfec">Marketplace</text>
    </g>
    <g>
      <rect x="1039" y="151" width="112" height="38" rx="19" fill="#111b35" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="1095" y="175.5" fill="#e0dfec">Shipping</text>
    </g>
    <g>
      <rect x="1033" y="241" width="124" height="38" rx="19" fill="#111b35" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="1095" y="265.5" fill="#e0dfec">ERP · Stock</text>
    </g>
  </g>
</svg>
